name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    # Le baseline visive dipendono dal sistema: stessa immagine con cui si generano.
    # L'immagine include Node 24, sufficiente per Astro (>= 22.23.4).
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # Confronti visivi con le baseline di tests/e2e/look.spec.ts-snapshots/: se ne manca una, il test fallisce.
      PW_VISUAL: '1'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
